name: Reviewer Agent

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  reviewer:
    # 门禁：
    #   1. PR 当前带 review-this 标签（labeled / synchronize 事件的 labels 数组都可判断）
    #   2. 非 draft
    #   3. 非机器人自触发
    # 安全说明：pull_request_target 默认检出 base 分支，脚本不来自 PR；
    # 标签只能由有权限的人添加，天然形成人工门禁；fork PR 因此可以安全支持。
    if: |
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'review-this') &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'openhands-bot'
    concurrency:
      group: reviewer-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout base branch code
        uses: actions/checkout@v4
        # pull_request_target 上下文默认检出 base；不要指定 ref，避免检出 PR 代码
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai==2.33.0 requests==2.33.1 pyyaml==6.0.3
      - name: Run Reviewer Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          REVIEWER_LLM_API_KEY: ${{ secrets.REVIEWER_LLM_API_KEY }}
          REVIEWER_LLM_BASE_URL: ${{ secrets.REVIEWER_LLM_BASE_URL }}
          REVIEWER_CONFIG: .github/reviewer.yml
        run: |
          # 模型由 .github/reviewer.yml 的 model 字段控制（CLI 可覆盖）
          python -m scripts.reviewer.main \
            --set-status

  secrets-scan:
    if: |
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'review-this')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Gitleaks version
        id: gitleaks-version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Gitleaks
        run: |
          VERSION="${{ steps.gitleaks-version.outputs.version }}"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan PR head for secrets
        run: gitleaks git --redact --exit-code=1
